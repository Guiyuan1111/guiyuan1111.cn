name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro-og-canvas
          key: ${{ runner.os }}-og-${{ hashFiles('src/content/posts/**', 'src/content/about/**', 'src/assets/fonts/*', 'src/pages/og/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-
      - uses: actions/cache@v4
        with:
          path: .astro
          key: ${{ runner.os }}-astro-${{ hashFiles('src/content/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-astro-
      - run: pnpm build
      - name: Perf red-line gate
        run: node benchmark/run-all.mjs --assert
